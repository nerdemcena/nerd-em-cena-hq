<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 360" width="260" height="360">
  <defs>
    <linearGradient id="pages" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8f4e8"/>
      <stop offset="100%" stop-color="#e6e0d0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Back cover / shadow -->
  <path d="M50 40 L220 40 L240 320 L30 320 Z" fill="#0a0a0a" opacity="0.35"/>

  <!-- Pages block -->
  <path d="M55 50 L220 50 L220 310 L55 310 Z" fill="url(#pages)"/>
  <path d="M55 50 L75 30 L240 30 L220 50 Z" fill="#f8f4e8"/>
  <path d="M220 50 L240 30 L240 290 L220 310 Z" fill="#e6e0d0"/>

  <!-- Cover -->
  <path d="M30 30 L210 30 L210 330 L30 330 Z" fill="#050505" stroke="url(#gold)" stroke-width="2"/>

  <!-- Spine -->
  <path d="M30 30 L50 50 L50 330 L30 330 Z" fill="#0a0a0a" stroke="url(#gold)" stroke-width="1.5"/>
  <line x1="35" y1="50" x2="35" y2="310" stroke="url(#gold)" stroke-width="1.5"/>
  <line x1="42" y1="50" x2="42" y2="310" stroke="url(#gold)" stroke-width="1.5"/>

  <!-- Decorative corners -->
  <path d="M40 40 L60 40 L60 50 L50 50 L50 60 L40 60 Z" fill="url(#gold)"/>
  <path d="M180 40 L200 40 L200 60 L190 60 L190 50 L180 50 Z" fill="url(#gold)"/>
  <path d="M40 300 L50 300 L50 310 L60 310 L60 320 L40 320 Z" fill="url(#gold)"/>
  <path d="M190 300 L200 300 L200 320 L180 320 L180 310 L190 310 Z" fill="url(#gold)"/>

  <!-- Title text -->
  <text x="120" y="90" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="22" fill="url(#gold)" letter-spacing="1">KIT INICIANTE</text>
  <text x="120" y="125" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="20" fill="url(#gold)" letter-spacing="1">RPG &amp; TEATRO</text>

  <!-- D20 die -->
  <g transform="translate(120,185)" filter="url(#glow)">
    <polygon points="0,-45 40,-15 40,30 0,55 -40,30 -40,-15" fill="url(#gold)" stroke="#0a0a0a" stroke-width="1.5"/>
    <polygon points="0,-45 40,-15 0,5 -40,-15" fill="#facc15"/>
    <polygon points="0,-45 0,5 -40,-15" fill="#eab308"/>
    <polygon points="0,-45 40,-15 0,5" fill="#facc15"/>
    <polygon points="0,5 40,-15 40,30 0,55 -40,30 -40,-15" fill="#ca8a04" opacity="0.3"/>
    <text x="0" y="8" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="20" fill="#0a0a0a">20</text>
  </g>

  <!-- Masks -->
  <g transform="translate(120, 270)">
    <!-- comedy mask -->
    <path d="M-22,-15 C-32,-15 -36,0 -32,15 C-28,25 -16,25 -12,15 C-8,25 4,25 8,15 C12,0 8,-15 -2,-15 Z" fill="url(#gold)" stroke="#0a0a0a" stroke-width="1"/>
    <circle cx="-16" cy="-2" r="2.5" fill="#0a0a0a"/>
    <circle cx="-8" cy="-2" r="2.5" fill="#0a0a0a"/>
    <path d="M-18,8 Q-12,14 -6,8" stroke="#0a0a0a" stroke-width="2" fill="none"/>
    <path d="M-22,-15 Q-12,-22 -2,-15" stroke="url(#gold)" stroke-width="3" fill="none"/>

    <!-- tragedy mask -->
    <path d="M2,-15 C-8,-15 -12,0 -8,15 C-4,25 8,25 12,15 C16,25 28,25 32,15 C36,0 32,-15 22,-15 Z" fill="url(#gold)" stroke="#0a0a0a" stroke-width="1"/>
    <circle cx="8" cy="-2" r="2.5" fill="#0a0a0a"/>
    <circle cx="16" cy="-2" r="2.5" fill="#0a0a0a"/>
    <path d="M6,12 Q12,6 18,12" stroke="#0a0a0a" stroke-width="2" fill="none"/>
    <path d="M2,-15 Q12,-22 22,-15" stroke="url(#gold)" stroke-width="3" fill="none"/>
  </g>
</svg>
